<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Proofreading Viewer</title>
<style>
:root{
  --bg:#0e0e1a;--surface:#151525;--surface2:#1b1b2e;
  --border:#25254a;--text:#d2d2ec;--muted:#5a6090;
  --accent:#7070e0;--accent-dim:rgba(112,112,224,.15);
  --en-bg:#0b1a0b;--en-bd:#1a3a1a;--en-col:#70b870;
  --lg-bg:#0b0b22;--lg-bd:#1a1a44;--lg-col:#8080c8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font-family:'Segoe UI',system-ui,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px}

/* header */
#hdr{display:flex;align-items:center;gap:12px;padding:9px 16px;
     background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#hdr h1{font-size:13px;font-weight:600;color:#9090d8;letter-spacing:.02em}
#hdr .sp{flex:1}
#stats{font-size:12px;color:var(--muted)}
#built{font-size:11px;color:#30305a}

/* toolbar */
#toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;
         padding:7px 14px;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0}
.tb-label{font-size:12px;color:var(--muted);white-space:nowrap}
#lang-pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{padding:3px 11px;border-radius:99px;border:1px solid var(--border);cursor:pointer;
      font-size:12px;color:var(--muted);background:transparent;user-select:none;transition:all .12s}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.on{background:var(--accent-dim);border-color:var(--accent);color:#b0b0f0}
.pill.en{background:rgba(60,130,60,.12);border-color:var(--en-bd);color:var(--en-col);cursor:default}
.vsep{width:1px;background:var(--border);align-self:stretch}
#search{padding:4px 10px;border:1px solid var(--border);border-radius:4px;
        background:var(--surface);color:var(--text);font-size:12px;outline:none;width:190px}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
.sync-wrap{display:flex;align-items:center;gap:5px;cursor:pointer}
.sync-wrap input{accent-color:var(--accent)}
.sync-wrap label{font-size:12px;color:var(--muted);cursor:pointer}

/* layout */
#main{display:flex;flex:1;overflow:hidden}

/* sidebar */
#sidebar{width:215px;flex-shrink:0;display:flex;flex-direction:column;
         background:var(--surface);border-right:1px solid var(--border);overflow:hidden}
#sb-hdr{padding:9px 12px 5px;font-size:10px;font-weight:700;text-transform:uppercase;
        letter-spacing:.1em;color:var(--muted);flex-shrink:0}
#sb-count{padding:0 12px 7px;font-size:11px;color:#404070;flex-shrink:0}
#file-list{flex:1;overflow-y:auto}
.fldr{padding:10px 12px 3px;font-size:10px;font-weight:700;text-transform:uppercase;
      letter-spacing:.08em;color:#363660}
.fitem{padding:7px 12px 7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis;color:#7070a0;
       border-left:2px solid transparent;transition:all .1s}
.fitem:hover{background:var(--surface2);color:var(--text)}
.fitem.on{background:var(--accent-dim);color:#c0c0f0;border-left-color:var(--accent)}
.fitem.warn{color:#b06060}
.fitem.warn::after{content:' ⚠';font-size:10px}

/* viewer */
#viewer{flex:1;display:flex;overflow:hidden;background:var(--border);gap:1px}
.panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.phead{display:flex;align-items:center;padding:7px 12px;flex-shrink:0;gap:8px}
.phead.en{background:var(--en-bg);border-bottom:1px solid var(--en-bd)}
.phead.lg{background:var(--lg-bg);border-bottom:1px solid var(--lg-bd)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;
       text-transform:uppercase;flex-shrink:0;letter-spacing:.05em}
.badge.en{background:rgba(60,130,60,.25);color:#80c080}
.badge.lg{background:rgba(80,80,200,.25);color:#8888cc}
.fpath{font-size:11px;color:var(--muted);flex:1;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap}
.vbtns{display:flex;gap:2px;flex-shrink:0}
.vbtn{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;
      background:transparent;color:var(--muted);cursor:pointer}
.vbtn:hover{color:var(--text)}
.vbtn.on{background:var(--accent-dim);color:var(--text);border-color:rgba(112,112,224,.4)}

.pbody{flex:1;overflow-y:auto;overflow-x:hidden}
.pbody pre{padding:14px;font-family:'Cascadia Code','Consolas','Courier New',monospace;
           font-size:12px;line-height:1.8;color:#c0c0e0;white-space:pre-wrap;word-break:break-word}
.pbody .rview{padding:1.5rem;line-height:1.8;color:var(--text)}
.pbody .rview *{max-width:100%}
.pbody .empty{display:flex;align-items:center;justify-content:center;
              height:100%;color:#35355a;font-size:13px;text-align:center;padding:2rem}

mark{background:rgba(255,220,0,.28);color:#ffe060;border-radius:2px;padding:0 1px}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#32326a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#5050a0}
</style>
</head>

<div id="hdr">
  <h1>&#128196;&nbsp; Translation Proofreading Viewer</h1>
  <span class="sp"></span>
  <span id="stats"></span>
  <span id="built">Built 04 Jun 2026 07:36 UTC</span>
</div>

<div id="toolbar">
  <span class="tb-label">Language:</span>
  <div id="lang-pills"><span class="pill en">en</span></div>
  <div class="vsep"></div>
  <span class="tb-label">&#128269;</span>
  <input type="text" id="search" placeholder="Highlight text in both panels…" oninput="doSearch()">
  <div class="vsep"></div>
  <div class="sync-wrap">
    <input type="checkbox" id="sync" checked onchange="setupSync()">
    <label for="sync">Sync scroll</label>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sb-hdr">Folders</div>
    <div id="sb-count"></div>
    <div id="file-list"></div>
  </div>

  <div id="viewer">
    <div class="panel" id="panel-en">
      <div class="phead en">
        <span class="badge en">EN</span>
        <span class="fpath" id="en-path">—</span>
        <div class="vbtns">
          <button class="vbtn on" id="b-en-raw"  onclick="setView('en','raw')">raw</button>
          <button class="vbtn"    id="b-en-rend" onclick="setView('en','rendered')">rendered</button>
        </div>
      </div>
      <div class="pbody" id="body-en"><div class="empty">Select a folder from the sidebar</div></div>
    </div>

    <div class="panel" id="panel-other">
      <div class="phead lg">
        <span class="badge lg" id="other-badge">—</span>
        <span class="fpath" id="other-path">—</span>
        <div class="vbtns">
          <button class="vbtn on" id="b-ot-raw"  onclick="setView('other','raw')">raw</button>
          <button class="vbtn"    id="b-ot-rend" onclick="setView('other','rendered')">rendered</button>
        </div>
      </div>
      <div class="pbody" id="body-other"><div class="empty">Select a language above</div></div>
    </div>
  </div>
</div>

    \"beneficiary_name\": \"ชื่อผู้รับผลประโยชน์\",\n    \"branch\": \"สาขา\",\n    \"branch_code\": \"รหัสสาขา\",\n    \"currency\": \"สกุลเงิน\",\n    \"iban\": \"IBAN\",\n    \"reason\": \"เหตุผล\",\n    \"rejected_reason\": \"เหตุผลที่ถูกปฏิเสธ\",\n    \"swift_code\": \"รหัส SWIFT\",\n    \"type\": \"ประเภท\"\n  },\n  \"paidCommission\": \"ค่าคอมมิชชันที่จ่ายแล้ว\",\n  \"paymentInformation\": \"ข้อมูลการชำระเงิน\",\n  \"pendingCommission\": \"ค่าคอมมิชชันที่รอดำเนินการ\",\n  \"please_select\": \"กรุณาเลือก\",\n  \"please_wait\": \"กรุณารอสักครู่...\",\n  \"processedAmount\": \"จำนวนที่ดำเนินการแล้ว\",\n  \"processedCurrency\": \"สกุลเงินที่ดำเนินการแล้ว\",\n  \"processedDate\": \"วันที่ดำเนินการ\",\n  \"referenceInformation\": \"ข้อมูลอ้างอิง\",\n  \"reload\": \"โหลดใหม่\",\n  \"requestDetails\": \"รายละเอียดคำขอ\",\n  \"requestwithdrawaldesc\": \"คุณกำลังจะขอถอนเงินจากยอดคงเหลือในกระเป๋าเงินปัจจุบันของคุณ\",\n  \"submit\": \"ส่ง\",\n  \"submitpayment\": \"ส่งรายละเอียดการชำระเงิน\",\n  \"table\": {\n    \"currency\": \"สกุลเงิน\",\n    \"id\": \"รหัส\",\n    \"processed_amount\": \"จำนวนที่ดำเนินการแล้ว\",\n    \"processed_currency\": \"สกุลเงินที่ดำเนินการแล้ว\",\n    \"processed_date\": \"วันที่ดำเนินการ\",\n    \"requested_amount\": \"จำนวนที่ขอ\",\n    \"requested_date\": \"วันที่ขอ\"\n  },\n  \"walletBalance\": \"ยอดคงเหลือในกระเป๋าเงิน\",\n  \"withdrawal_amount\": \"จำนวนที่ถอน\",\n  \"details\": \"รายละเอียด\",\n  \"new\": \"ใหม่\",\n  \"completed\": \"เสร็จสมบูรณ์\",\n  \"pending\": \"รอดำเนินการ\",\n  \"in_progress\": \"กำลังดำเนินการ\",\n  \"cancelled\": \"ยกเลิกแล้ว\",\n  \"rejected\": \"ถูกปฏิเสธ\",\n  \"clientsaccounts\": \"บัญชีลูกค้า\",\n  \"signUpLinkRegionDesc\": \"กรุณาเลือกภูมิภาคที่คุณวางแผนจะแนะนำลูกค้า มิฉะนั้นลูกค้าอาจไม่สามารถลงทะเบียนได้\",\n  \"region\": \"ภูมิภาค\",\n  \"historicTrades\": \"ประวัติการซื้อขาย\"\n}"}}}</script>

<script>
const FILES = JSON.parse(document.getElementById('tdata').textContent);
let S = {base:null, lang:null, vEn:'raw', vOt:'raw', syncing:false};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

(function init(){
  const bases = Object.keys(FILES);
  const lset  = new Set();
  bases.forEach(b =>
    Object.keys(FILES[b]).filter(k => !k.startsWith('_') && k !== 'en').forEach(l => lset.add(l))
  );
  const langs = [...lset].sort();

  const total   = bases.length;
  const withEn  = bases.filter(b => FILES[b]['en']).length;
  document.getElementById('stats').textContent =
    `${total} group${total!==1?'s':''} \u00b7 ${langs.length} lang${langs.length!==1?'s':''}: ${langs.join(', ')||'none'}`;

  // Language pills
  const pillsEl = document.getElementById('lang-pills');
  pillsEl.innerHTML = '<span class="pill en">en</span>' +
    langs.map(l => `<span class="pill" data-l="${l}" onclick="pickLang('${l}')">${l}</span>`).join('');
  if (langs.length) pickLang(langs[0]);

  // Sidebar grouped by parent folder
  const byParent = {};
  bases.forEach(b => {
    const key   = FILES[b]._display || b;
    const si    = key.lastIndexOf('/');
    const parent = si >= 0 ? key.slice(0, si) : '';
    const label  = si >= 0 ? key.slice(si + 1) : key;
    (byParent[parent] = byParent[parent] || []).push({key: b, label, hasEn: !!FILES[b]['en']});
  });

  const listEl  = document.getElementById('file-list');
  const parents = Object.keys(byParent).sort();
  listEl.innerHTML = parents.map(p => {
    const hdr = p ? `<div class="fldr">${esc(p)}</div>` : '';
    return hdr + byParent[p].map(it => {
      const indent = p ? 'style="padding-left:22px"' : '';
      return `<div class="fitem${it.hasEn ? '' : ' warn'}" data-k="${it.key}"
        onclick="pickBase('${it.key.replace(/'/g, "\\'")}')"
        title="${esc(it.key)}" ${indent}>${esc(it.label)}</div>`;
    }).join('');
  }).join('');

  const warnCount = bases.filter(b => !FILES[b]['en']).length;
  document.getElementById('sb-count').textContent =
    `${total} folder${total!==1?'s':''}${warnCount ? ` \u00b7 ${warnCount} missing EN` : ''}`;

  if (bases.length) pickBase(bases[0]);
})();

function pickBase(key) {
  S.base = key;
  document.querySelectorAll('.fitem').forEach(el => el.classList.toggle('on', el.dataset.k === key));
  render();
}

function pickLang(l) {
  S.lang = l;
  document.querySelectorAll('.pill[data-l]').forEach(el => el.classList.toggle('on', el.dataset.l === l));
  document.getElementById('other-badge').textContent = l.toUpperCase();
  render();
}

function setView(panel, mode) {
  if (panel === 'en') {
    S.vEn = mode;
    document.getElementById('b-en-raw').classList.toggle('on', mode === 'raw');
    document.getElementById('b-en-rend').classList.toggle('on', mode === 'rendered');
  } else {
    S.vOt = mode;
    document.getElementById('b-ot-raw').classList.toggle('on', mode === 'raw');
    document.getElementById('b-ot-rend').classList.toggle('on', mode === 'rendered');
  }
  render();
}

function fillPanel(bodyId, pathId, file, mode) {
  const body   = document.getElementById(bodyId);
  const pathEl = document.getElementById(pathId);
  if (!file) {
    pathEl.textContent = 'not found';
    body.innerHTML = '<div class="empty">File not found for this folder</div>';
    return;
  }
  pathEl.textContent = file.rel;
  body.innerHTML = mode === 'rendered'
    ? `<div class="rview">${file.content}</div>`
    : `<pre>${esc(file.content)}</pre>`;
}

function render() {
  if (!S.base) return;
  const enFile = FILES[S.base]?.['en'];
  const otFile = S.lang ? FILES[S.base]?.[S.lang] : null;

  fillPanel('body-en', 'en-path', enFile, S.vEn);

  if (!S.lang) {
    document.getElementById('other-path').textContent = '—';
    document.getElementById('body-other').innerHTML = '<div class="empty">Select a language above</div>';
  } else {
    fillPanel('body-other', 'other-path', otFile, S.vOt);
  }

  doSearch();
  setupSync();
}

function doSearch() {
  const q = document.getElementById('search').value.trim();
  highlightPre('body-en', q);
  highlightPre('body-other', q);
}

function highlightPre(bodyId, q) {
  const pre = document.getElementById(bodyId).querySelector('pre');
  if (!pre) return;
  const raw = pre.textContent;
  if (!q) { pre.innerHTML = esc(raw); return; }
  const eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  pre.innerHTML = esc(raw).replace(new RegExp(`(${eq})`, 'gi'), '<mark>$1</mark>');
}

function setupSync() {
  const a = document.getElementById('body-en');
  const b = document.getElementById('body-other');
  a.onscroll = b.onscroll = null;
  if (!document.getElementById('sync').checked) return;
  a.onscroll = () => {
    if (S.syncing) return; S.syncing = true;
    b.scrollTop = (a.scrollTop / (a.scrollHeight - a.clientHeight || 1))
                  * (b.scrollHeight - b.clientHeight);
    S.syncing = false;
  };
  b.onscroll = () => {
    if (S.syncing) return; S.syncing = true;
    a.scrollTop = (b.scrollTop / (b.scrollHeight - b.clientHeight || 1))
                  * (a.scrollHeight - a.clientHeight);
    S.syncing = false;
  };
}
</script>
