<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Text Diff</title>
  <style>
    :root {
      --bg: 11 16 32;
      --panel: 17 24 45;
      --panel-2: 23 31 55;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --primary: #3AE5E7;
      --secondary: #FF6F61;
      --accent: #FFBD60;
      --accent-dark: #8b8b8b8e;
      --border: rgba(243,244,246,0.12);
      --shadow: rgba(0,0,0,0.22);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --add-soft: rgba(58,229,231,0.14);
      --add-strong: rgba(58,229,231,0.38);
      --remove-soft: rgba(255,111,97,0.14);
      --remove-strong: rgba(255,111,97,0.38);
      --change-soft: rgba(255,189,96,0.14);
      --change-strong: rgba(255,189,96,0.38);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: rgb(var(--bg));
      color: var(--text);
      font-family: var(--sans);
    }

    body { min-width: 320px; }

    button, select, input { font: inherit; }

    .app {
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at top left, rgba(58,229,231,0.07), transparent 28rem),
        linear-gradient(180deg, rgba(17,24,45,0.72), rgba(11,16,32,1));
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      background: rgba(var(--panel),0.82);
      box-shadow: 0 10px 25px var(--shadow);
      z-index: 10;
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    label {
      color: var(--text-muted);
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    select, button {
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: rgba(var(--panel-2),0.95);
      color: var(--text);
      min-height: 2.15rem;
      padding: 0.45rem 0.7rem;
      outline: none;
    }

    select:focus, button:focus-visible, input:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(58,229,231,0.16);
    }

    button {
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(58,229,231,0.42);
      background: rgba(32,43,72,0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .primary-action {
      border-color: rgba(58,229,231,0.42);
      color: var(--primary);
    }

    .secondary-action { color: var(--text-muted); }

    .danger-action {
      color: var(--secondary);
      border-color: rgba(255,111,97,0.28);
    }

    input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .status {
      margin-left: auto;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 1.2rem;
      white-space: nowrap;
    }

    .status.ok { color: var(--primary); }
    .status.diff { color: var(--secondary); }
    .status.warn { color: var(--accent); }

    .main {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      padding: 0.75rem;
      gap: 0.75rem;
    }

    .editor-grid, .diff-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.75rem;
    }

    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: rgba(var(--panel),0.72);
      overflow: hidden;
      box-shadow: 0 18px 45px var(--shadow);
    }

    .panel-header {
      min-height: 2.55rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.7rem;
      border-bottom: 1px solid var(--border);
      background: rgba(var(--panel-2),0.62);
      color: var(--text-muted);
      font-size: 0.84rem;
    }

    .panel-header strong {
      color: var(--text);
      font-weight: 600;
    }

    .editor-host, .textarea-fallback {
      min-height: 0;
      height: 100%;
      width: 100%;
    }

    .textarea-fallback {
      display: none;
      background: #0b1020;
      color: var(--text);
      border: 0;
      outline: 0;
      resize: none;
      padding: 1rem;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
    }

    .diff-pane {
      min-height: 0;
      overflow: auto;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
      background: #0b1020;
      scrollbar-color: rgba(156,163,175,0.5) transparent;
    }

    .diff-table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }

    .diff-row { display: table-row; }
    .diff-row.current .line-number { color: var(--primary); }
    .diff-row.current .line-content { outline: 1px solid rgba(58,229,231,0.6); outline-offset: -1px; }

    .line-number, .line-content {
      display: table-cell;
      vertical-align: top;
      border-bottom: 1px solid rgba(243,244,246,0.04);
    }

    .line-number {
      width: 4.2rem;
      min-width: 4.2rem;
      text-align: right;
      user-select: none;
      color: rgba(156,163,175,0.72);
      padding: 0.05rem 0.65rem 0.05rem 0.35rem;
      background: rgba(17,24,45,0.62);
      border-right: 1px solid rgba(243,244,246,0.07);
    }

    .line-content {
      white-space: pre;
      padding: 0.05rem 0.8rem;
      min-width: 100%;
    }

    .wrap .line-content { white-space: pre-wrap; overflow-wrap: anywhere; }

    .line-added .line-content { background: var(--add-soft); }
    .line-removed .line-content { background: var(--remove-soft); }
    .line-changed .line-content { background: var(--change-soft); }
    .line-blank .line-content { background: rgba(156,163,175,0.04); }

    .mark-added, .mark-removed, .mark-changed {
      border-radius: 0.2rem;
      padding: 0 0.04rem;
    }

    .mark-added { background: var(--add-strong); color: var(--text); }
    .mark-removed { background: var(--remove-strong); color: var(--text); }
    .mark-changed { background: var(--change-strong); color: var(--text); }

    .hidden { display: none !important; }

    .monaco-editor, .monaco-diff-editor, .monaco-editor-background, .monaco-editor .margin {
      background-color: #0b1020 !important;
    }

    @media (max-width: 820px) {
      .toolbar { align-items: stretch; }
      .toolbar-group { width: 100%; }
      .status { width: 100%; margin-left: 0; }
      .editor-grid, .diff-grid { grid-template-columns: 1fr; }
      .main { padding: 0.55rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar" role="toolbar" aria-label="Diff controls">
      <div class="toolbar-group">
        <label for="formatSelect">Format</label>
        <select id="formatSelect" aria-label="Format">
          <option value="auto">Auto</option>
          <option value="plaintext">Plain Text</option>
          <option value="json">JSON</option>
          <option value="html">HTML</option>
          <option value="xml">XML</option>
          <option value="yaml">YAML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="sql">SQL</option>
          <option value="markdown">Markdown</option>
        </select>
      </div>

      <div class="toolbar-group">
        <button id="formatLeft" type="button">Format Left</button>
        <button id="formatRight" type="button">Format Right</button>
        <button id="formatBoth" type="button">Format Both</button>
      </div>

      <div class="toolbar-group">
        <button id="compareBtn" class="primary-action" type="button">Compare</button>
        <button id="editBtn" class="secondary-action" type="button" disabled>Edit</button>
        <button id="prevBtn" type="button" disabled>Previous Diff</button>
        <button id="nextBtn" type="button" disabled>Next Diff</button>
      </div>

      <div class="toolbar-group">
        <label><input id="ignoreWhitespace" type="checkbox" /> Ignore whitespace</label>
        <label><input id="ignoreCase" type="checkbox" /> Ignore case</label>
        <label><input id="wrapLines" type="checkbox" /> Wrap long lines</label>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>

    <main class="main">
      <section id="editorGrid" class="editor-grid" aria-label="Input editors">
        <div class="panel">
          <div class="panel-header"><strong>Original</strong><button id="clearLeft" class="danger-action" type="button">Clear</button></div>
          <div id="leftEditor" class="editor-host"></div>
          <textarea id="leftFallback" class="textarea-fallback" spellcheck="false" aria-label="Original input"></textarea>
        </div>
        <div class="panel">
          <div class="panel-header"><strong>Modified</strong><button id="clearRight" class="danger-action" type="button">Clear</button></div>
          <div id="rightEditor" class="editor-host"></div>
          <textarea id="rightFallback" class="textarea-fallback" spellcheck="false" aria-label="Modified input"></textarea>
        </div>
      </section>

      <section id="diffGrid" class="diff-grid hidden" aria-label="Diff result">
        <div class="panel">
          <div class="panel-header"><strong>Original</strong><span id="leftDiffInfo"></span></div>
          <div id="leftDiff" class="diff-pane" tabindex="0" aria-label="Original diff"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><strong>Modified</strong><span id="rightDiffInfo"></span></div>
          <div id="rightDiff" class="diff-pane" tabindex="0" aria-label="Modified diff"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/loader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@2.8.8/standalone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@2.8.8/parser-babel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@2.8.8/parser-html.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@2.8.8/parser-postcss.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@2.8.8/parser-markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@2.8.8/parser-yaml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <script>
    (function () {
      'use strict';

      const store = {
        left: 'plain-diff.leftContent',
        right: 'plain-diff.rightContent',
        format: 'plain-diff.format',
        ignoreWhitespace: 'plain-diff.ignoreWhitespace',
        ignoreCase: 'plain-diff.ignoreCase',
        wrap: 'plain-diff.wrapLines'
      };

      const els = {
        formatSelect: document.getElementById('formatSelect'),
        formatLeft: document.getElementById('formatLeft'),
        formatRight: document.getElementById('formatRight'),
        formatBoth: document.getElementById('formatBoth'),
        compareBtn: document.getElementById('compareBtn'),
        editBtn: document.getElementById('editBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        ignoreWhitespace: document.getElementById('ignoreWhitespace'),
        ignoreCase: document.getElementById('ignoreCase'),
        wrapLines: document.getElementById('wrapLines'),
        status: document.getElementById('status'),
        editorGrid: document.getElementById('editorGrid'),
        diffGrid: document.getElementById('diffGrid'),
        leftEditor: document.getElementById('leftEditor'),
        rightEditor: document.getElementById('rightEditor'),
        leftFallback: document.getElementById('leftFallback'),
        rightFallback: document.getElementById('rightFallback'),
        leftDiff: document.getElementById('leftDiff'),
        rightDiff: document.getElementById('rightDiff'),
        leftDiffInfo: document.getElementById('leftDiffInfo'),
        rightDiffInfo: document.getElementById('rightDiffInfo'),
        clearLeft: document.getElementById('clearLeft'),
        clearRight: document.getElementById('clearRight')
      };

      let monacoRef = null;
      let leftEditor = null;
      let rightEditor = null;
      let usingFallback = false;
      let mode = 'edit';
      let diffIndexes = [];
      let currentDiff = -1;
      let syncingScroll = false;

      restoreState();
      initMonaco();
      wireEvents();
      applyWrapState();

      function restoreState() {
        els.formatSelect.value = localStorage.getItem(store.format) || 'auto';
        els.ignoreWhitespace.checked = localStorage.getItem(store.ignoreWhitespace) === 'true';
        els.ignoreCase.checked = localStorage.getItem(store.ignoreCase) === 'true';
        els.wrapLines.checked = localStorage.getItem(store.wrap) === 'true';
        els.leftFallback.value = localStorage.getItem(store.left) || '';
        els.rightFallback.value = localStorage.getItem(store.right) || '';
      }

      function initMonaco() {
        if (!window.require) {
          enableFallback('Monaco could not be loaded. Textarea fallback is active.');
          return;
        }

        window.require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs' } });
        window.require(['vs/editor/editor.main'], function (monaco) {
          monacoRef = monaco;
          defineTheme(monaco);
          const common = {
            theme: 'plain-diff-dark',
            automaticLayout: true,
            minimap: { enabled: false },
            scrollBeyondLastLine: false,
            wordWrap: els.wrapLines.checked ? 'on' : 'off',
            fontSize: 13,
            lineHeight: 20,
            tabSize: 2,
            insertSpaces: true,
            renderWhitespace: 'selection',
            padding: { top: 12, bottom: 12 }
          };
          leftEditor = monaco.editor.create(els.leftEditor, Object.assign({}, common, {
            value: els.leftFallback.value,
            language: languageFor(detectFormat(els.leftFallback.value))
          }));
          rightEditor = monaco.editor.create(els.rightEditor, Object.assign({}, common, {
            value: els.rightFallback.value,
            language: languageFor(detectFormat(els.rightFallback.value))
          }));

          leftEditor.onDidChangeModelContent(function () {
            localStorage.setItem(store.left, leftEditor.getValue());
            updateLanguage(leftEditor);
          });
          rightEditor.onDidChangeModelContent(function () {
            localStorage.setItem(store.right, rightEditor.getValue());
            updateLanguage(rightEditor);
          });
        }, function () {
          enableFallback('Monaco could not be loaded. Textarea fallback is active.');
        });
      }

      function defineTheme(monaco) {
        monaco.editor.defineTheme('plain-diff-dark', {
          base: 'vs-dark',
          inherit: true,
          rules: [
            { token: '', foreground: 'F3F4F6', background: '0B1020' },
            { token: 'comment', foreground: '9CA3AF' },
            { token: 'string', foreground: '3AE5E7' },
            { token: 'number', foreground: 'FFBD60' },
            { token: 'keyword', foreground: 'FF6F61' }
          ],
          colors: {
            'editor.background': '#0B1020',
            'editor.foreground': '#F3F4F6',
            'editorLineNumber.foreground': '#6B7280',
            'editorLineNumber.activeForeground': '#3AE5E7',
            'editorCursor.foreground': '#3AE5E7',
            'editor.selectionBackground': '#3AE5E733',
            'editor.inactiveSelectionBackground': '#3AE5E722',
            'editor.lineHighlightBackground': '#11182D',
            'editorGutter.background': '#0B1020'
          }
        });
      }

      function enableFallback(message) {
        usingFallback = true;
        els.leftEditor.style.display = 'none';
        els.rightEditor.style.display = 'none';
        els.leftFallback.style.display = 'block';
        els.rightFallback.style.display = 'block';
        setStatus(message, 'warn');
      }

      function wireEvents() {
        els.formatSelect.addEventListener('change', function () {
          localStorage.setItem(store.format, els.formatSelect.value);
          if (monacoRef && leftEditor && rightEditor) {
            updateLanguage(leftEditor);
            updateLanguage(rightEditor);
          }
        });

        els.ignoreWhitespace.addEventListener('change', persistOptions);
        els.ignoreCase.addEventListener('change', persistOptions);
        els.wrapLines.addEventListener('change', function () {
          persistOptions();
          applyWrapState();
        });

        els.formatLeft.addEventListener('click', function () { formatSide('left'); });
        els.formatRight.addEventListener('click', function () { formatSide('right'); });
        els.formatBoth.addEventListener('click', function () { formatSide('both'); });
        els.compareBtn.addEventListener('click', compare);
        els.editBtn.addEventListener('click', showEditMode);
        els.prevBtn.addEventListener('click', previousDiff);
        els.nextBtn.addEventListener('click', nextDiff);
        els.clearLeft.addEventListener('click', clearLeft);
        els.clearRight.addEventListener('click', clearRight);

        els.leftFallback.addEventListener('input', function () { localStorage.setItem(store.left, els.leftFallback.value); });
        els.rightFallback.addEventListener('input', function () { localStorage.setItem(store.right, els.rightFallback.value); });

        els.leftDiff.addEventListener('scroll', function () { syncScroll(els.leftDiff, els.rightDiff); });
        els.rightDiff.addEventListener('scroll', function () { syncScroll(els.rightDiff, els.leftDiff); });

        window.addEventListener('keydown', function (event) {
          const insideEditor = isInsideEditor(event.target);
          const key = event.key.toLowerCase();
          if (event.ctrlKey && !event.shiftKey && !event.altKey && key === 'f') {
            event.preventDefault();
            formatSide('both');
            return;
          }
          if (event.ctrlKey && !event.shiftKey && !event.altKey && event.key === 'Enter') {
            event.preventDefault();
            compare();
            return;
          }
          if (!insideEditor && mode === 'diff' && event.key === 'ArrowUp') {
            event.preventDefault();
            previousDiff();
          }
          if (!insideEditor && mode === 'diff' && event.key === 'ArrowDown') {
            event.preventDefault();
            nextDiff();
          }
        });

        window.addEventListener('resize', function () {
          if (leftEditor) leftEditor.layout();
          if (rightEditor) rightEditor.layout();
        });
      }

      function persistOptions() {
        localStorage.setItem(store.ignoreWhitespace, String(els.ignoreWhitespace.checked));
        localStorage.setItem(store.ignoreCase, String(els.ignoreCase.checked));
        localStorage.setItem(store.wrap, String(els.wrapLines.checked));
      }

      function isInsideEditor(target) {
        return Boolean(target && target.closest && target.closest('.monaco-editor, textarea'));
      }

      function getLeft() { return leftEditor ? leftEditor.getValue() : els.leftFallback.value; }
      function getRight() { return rightEditor ? rightEditor.getValue() : els.rightFallback.value; }
      function setLeft(value) {
        if (leftEditor) leftEditor.setValue(value); else els.leftFallback.value = value;
        localStorage.setItem(store.left, value);
      }
      function setRight(value) {
        if (rightEditor) rightEditor.setValue(value); else els.rightFallback.value = value;
        localStorage.setItem(store.right, value);
      }

      function clearLeft() {
        setLeft('');
        localStorage.removeItem(store.left);
        setStatus('Original input cleared.', 'ok');
      }

      function clearRight() {
        setRight('');
        localStorage.removeItem(store.right);
        setStatus('Modified input cleared.', 'ok');
      }

      function applyWrapState() {
        const wrap = els.wrapLines.checked;
        els.leftDiff.classList.toggle('wrap', wrap);
        els.rightDiff.classList.toggle('wrap', wrap);
        if (leftEditor) leftEditor.updateOptions({ wordWrap: wrap ? 'on' : 'off' });
        if (rightEditor) rightEditor.updateOptions({ wordWrap: wrap ? 'on' : 'off' });
      }

      function setStatus(message, type) {
        els.status.textContent = message || '';
        els.status.className = 'status' + (type ? ' ' + type : '');
      }

      function formatSide(side) {
        const targets = side === 'both' ? ['left', 'right'] : [side];
        const original = { left: getLeft(), right: getRight() };
        try {
          targets.forEach(function (target) {
            const value = target === 'left' ? original.left : original.right;
            const format = resolveFormat(value);
            const formatted = formatText(value, format);
            if (target === 'left') setLeft(formatted); else setRight(formatted);
          });
          setStatus(side === 'both' ? 'Formatted both inputs.' : 'Formatted ' + (side === 'left' ? 'Original.' : 'Modified.'), 'ok');
        } catch (error) {
          if (side === 'both') {
            setLeft(original.left);
            setRight(original.right);
          }
          setStatus(error.message, 'diff');
        }
      }

      function resolveFormat(value) {
        const selected = els.formatSelect.value;
        return selected === 'auto' ? detectFormat(value) : selected;
      }

      function detectFormat(value) {
        const text = (value || '').trim();
        if (!text) return 'plaintext';
        if ((text.startsWith('{') && text.endsWith('}')) || (text.startsWith('[') && text.endsWith(']'))) {
          try { JSON.parse(text); return 'json'; } catch (_) {}
        }
        if (/^<!doctype\s+html/i.test(text) || /<html[\s>]/i.test(text) || /<body[\s>]/i.test(text)) return 'html';
        if (/^<\?xml/i.test(text) || (/^<[^>]+>/.test(text) && /<\/[^>]+>\s*$/.test(text))) return 'xml';
        if (/^\s*[{.#]?[\w-]+\s*\{[\s\S]*\}\s*$/.test(text) && /[:;]/.test(text)) return 'css';
        if (/\b(select|insert|update|delete|create|alter|drop|from|where|join)\b/i.test(text) && /(;|\bfrom\b|\bwhere\b)/i.test(text)) return 'sql';
        if (/\b(function|const|let|var|import|export|class|interface|type)\b/.test(text)) return /\b(interface|type\s+\w+\s*=|implements|readonly)\b/.test(text) ? 'typescript' : 'javascript';
        if (/^\s*---\s*$/.test(text.split('\n')[0]) || /^\s*[\w-]+:\s+/.test(text)) return 'yaml';
        if (/^\s{0,3}#{1,6}\s+/.test(text) || /\[[^\]]+\]\([^\)]+\)/.test(text)) return 'markdown';
        return 'plaintext';
      }

      function languageFor(format) {
        const map = {
          plaintext: 'plaintext', json: 'json', html: 'html', xml: 'xml', yaml: 'yaml', css: 'css',
          javascript: 'javascript', typescript: 'typescript', sql: 'sql', markdown: 'markdown'
        };
        return map[format] || 'plaintext';
      }

      function updateLanguage(editor) {
        if (!monacoRef || !editor) return;
        const format = resolveFormat(editor.getValue());
        const model = editor.getModel();
        if (model) monacoRef.editor.setModelLanguage(model, languageFor(format));
      }

      function formatText(value, format) {
        if (!value.trim() || format === 'plaintext') return value;
        try {
          if (format === 'json') return JSON.stringify(JSON.parse(value), null, 2) + '\n';
          if (format === 'xml') return formatXml(value);
          if (format === 'sql') return formatSql(value);
          if (format === 'yaml') return formatYaml(value);
          if (window.prettier) {
            const parser = prettierParserFor(format);
            if (parser) return window.prettier.format(value, { parser, plugins: prettierPlugins(), printWidth: 100, tabWidth: 2, singleQuote: false });
          }
          if (format === 'html') return formatMarkup(value);
          if (format === 'css') return formatCss(value);
          return value;
        } catch (error) {
          const label = format.toUpperCase();
          throw new Error('Unable to format as ' + label + ': ' + (error && error.message ? error.message : String(error)));
        }
      }

      function prettierPlugins() {
        return [window.prettierPlugins && window.prettierPlugins.babel, window.prettierPlugins && window.prettierPlugins.html, window.prettierPlugins && window.prettierPlugins.postcss, window.prettierPlugins && window.prettierPlugins.markdown, window.prettierPlugins && window.prettierPlugins.yaml].filter(Boolean);
      }

      function prettierParserFor(format) {
        return ({ html: 'html', css: 'css', javascript: 'babel', typescript: 'typescript', markdown: 'markdown', yaml: 'yaml' })[format] || null;
      }

      function formatYaml(value) {
        if (window.prettier && window.prettierPlugins && window.prettierPlugins.yaml) {
          return window.prettier.format(value, { parser: 'yaml', plugins: prettierPlugins(), tabWidth: 2 });
        }
        if (window.jsyaml) return window.jsyaml.dump(window.jsyaml.load(value), { indent: 2, lineWidth: 100 });
        return value;
      }

      function formatSql(value) {
        const keywords = ['SELECT','FROM','WHERE','GROUP BY','ORDER BY','HAVING','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','JOIN','VALUES','SET','AND','OR'];
        let out = value.replace(/\s+/g, ' ').trim();
        keywords.forEach(function (keyword) {
          const rx = new RegExp('\\s+(' + keyword.replace(' ', '\\s+') + ')\\s+', 'ig');
          out = out.replace(rx, '\n$1 ');
        });
        out = out.replace(/,\s*/g, ',\n  ');
        return out.trim() + '\n';
      }

      function formatCss(value) {
        return value.replace(/\s*{\s*/g, ' {\n  ').replace(/;\s*/g, ';\n  ').replace(/\s*}\s*/g, '\n}\n').replace(/\n\s*\n/g, '\n').trim() + '\n';
      }

      function formatXml(value) { return formatMarkup(value); }

      function formatMarkup(value) {
        const tokens = value.replace(/>\s*</g, '><').replace(/</g, '\n<').replace(/>/g, '>\n').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
        let indent = 0;
        const lines = tokens.map(function (token) {
          if (/^<\//.test(token)) indent = Math.max(0, indent - 1);
          const line = '  '.repeat(indent) + token;
          if (/^<[^!?/][^>]*[^/]?>$/.test(token) && !/^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b/i.test(token)) indent += 1;
          return line;
        });
        return lines.join('\n') + '\n';
      }

      function compare() {
        const left = getLeft();
        const right = getRight();
        const result = buildDiffRows(left, right);
        renderDiff(result.rows);
        showDiffMode();
        diffIndexes = result.rows.map(function (row, index) { return row.type === 'equal' ? -1 : index; }).filter(function (index) { return index >= 0; });
        currentDiff = diffIndexes.length ? 0 : -1;
        updateDiffControls();
        updateStatus(result.diffCount);
        if (currentDiff >= 0) scrollToDiff(currentDiff);
      }

      function updateStatus(diffCount) {
        const flags = [];
        if (els.ignoreWhitespace.checked) flags.push('whitespace');
        if (els.ignoreCase.checked) flags.push('case');
        const suffix = flags.length ? ' with ' + flags.join(' and ') + ' ignored' : '';
        if (diffCount === 0) setStatus('No differences found' + suffix + '. Both sides are identical.', 'ok');
        else setStatus(diffCount + ' difference' + (diffCount === 1 ? '' : 's') + ' found' + suffix + '.', 'diff');
      }

      function showDiffMode() {
        mode = 'diff';
        els.editorGrid.classList.add('hidden');
        els.diffGrid.classList.remove('hidden');
        els.editBtn.disabled = false;
        els.compareBtn.disabled = false;
      }

      function showEditMode() {
        mode = 'edit';
        els.diffGrid.classList.add('hidden');
        els.editorGrid.classList.remove('hidden');
        els.editBtn.disabled = true;
        els.prevBtn.disabled = true;
        els.nextBtn.disabled = true;
        setStatus('Edit mode.', '');
        setTimeout(function () {
          if (leftEditor) leftEditor.layout();
          if (rightEditor) rightEditor.layout();
        }, 0);
      }

      function normalizeLine(line) {
        let value = line;
        if (els.ignoreWhitespace.checked) value = value.replace(/\s+/g, ' ').trim();
        if (els.ignoreCase.checked) value = value.toLowerCase();
        return value;
      }

      function splitLines(value) {
        return value.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      }

      function buildDiffRows(leftText, rightText) {
        const leftLines = splitLines(leftText);
        const rightLines = splitLines(rightText);
        const leftNorm = leftLines.map(normalizeLine);
        const rightNorm = rightLines.map(normalizeLine);
        const chunks = window.Diff && window.Diff.diffArrays ? window.Diff.diffArrays(leftNorm, rightNorm) : fallbackChunks(leftNorm, rightNorm);
        const rows = [];
        let li = 0;
        let ri = 0;
        let pendingRemoved = [];
        let diffCount = 0;

        function flushRemoved() {
          pendingRemoved.forEach(function (item) {
            rows.push({ type: 'removed', leftLineNo: item.lineNo, rightLineNo: '', left: item.text, right: '' });
            diffCount += 1;
          });
          pendingRemoved = [];
        }

        chunks.forEach(function (chunk) {
          if (!chunk.added && !chunk.removed) {
            flushRemoved();
            chunk.value.forEach(function () {
              rows.push({ type: 'equal', leftLineNo: li + 1, rightLineNo: ri + 1, left: leftLines[li] || '', right: rightLines[ri] || '' });
              li += 1; ri += 1;
            });
            return;
          }

          if (chunk.removed) {
            chunk.value.forEach(function () {
              pendingRemoved.push({ lineNo: li + 1, text: leftLines[li] || '' });
              li += 1;
            });
            return;
          }

          if (chunk.added) {
            const added = [];
            chunk.value.forEach(function () {
              added.push({ lineNo: ri + 1, text: rightLines[ri] || '' });
              ri += 1;
            });
            const pairCount = Math.min(pendingRemoved.length, added.length);
            for (let i = 0; i < pairCount; i += 1) {
              rows.push({ type: 'changed', leftLineNo: pendingRemoved[i].lineNo, rightLineNo: added[i].lineNo, left: pendingRemoved[i].text, right: added[i].text });
              diffCount += 1;
            }
            for (let i = pairCount; i < pendingRemoved.length; i += 1) {
              rows.push({ type: 'removed', leftLineNo: pendingRemoved[i].lineNo, rightLineNo: '', left: pendingRemoved[i].text, right: '' });
              diffCount += 1;
            }
            for (let i = pairCount; i < added.length; i += 1) {
              rows.push({ type: 'added', leftLineNo: '', rightLineNo: added[i].lineNo, left: '', right: added[i].text });
              diffCount += 1;
            }
            pendingRemoved = [];
          }
        });
        flushRemoved();
        return { rows: rows, diffCount: diffCount };
      }

      function fallbackChunks(leftNorm, rightNorm) {
        const chunks = [];
        const max = Math.max(leftNorm.length, rightNorm.length);
        for (let i = 0; i < max; i += 1) {
          if (leftNorm[i] === rightNorm[i]) chunks.push({ value: [leftNorm[i]] });
          else {
            if (i < leftNorm.length) chunks.push({ removed: true, value: [leftNorm[i]] });
            if (i < rightNorm.length) chunks.push({ added: true, value: [rightNorm[i]] });
          }
        }
        return chunks;
      }

      function renderDiff(rows) {
        els.leftDiff.innerHTML = renderSide(rows, 'left');
        els.rightDiff.innerHTML = renderSide(rows, 'right');
        els.leftDiffInfo.textContent = rows.length + ' lines';
        els.rightDiffInfo.textContent = rows.length + ' lines';
        applyWrapState();
      }

      function renderSide(rows, side) {
        return '<div class="diff-table">' + rows.map(function (row, index) {
          const lineNo = side === 'left' ? row.leftLineNo : row.rightLineNo;
          const content = side === 'left' ? row.left : row.right;
          const cls = rowClass(row, side);
          const rendered = renderContent(row, side);
          return '<div class="diff-row ' + cls + '" data-row="' + index + '"><div class="line-number">' + escapeHtml(String(lineNo || '')) + '</div><div class="line-content">' + rendered + '</div></div>';
        }).join('') + '</div>';
      }

      function rowClass(row, side) {
        if (row.type === 'equal') return '';
        if (row.type === 'added') return side === 'right' ? 'line-added' : 'line-blank';
        if (row.type === 'removed') return side === 'left' ? 'line-removed' : 'line-blank';
        if (row.type === 'changed') return 'line-changed';
        return '';
      }

      function renderContent(row, side) {
        if (row.type === 'added') return side === 'right' ? '<span class="mark-added">' + escapeHtml(row.right || ' ') + '</span>' : '&nbsp;';
        if (row.type === 'removed') return side === 'left' ? '<span class="mark-removed">' + escapeHtml(row.left || ' ') + '</span>' : '&nbsp;';
        if (row.type === 'changed') {
          const parts = characterDiff(row.left || '', row.right || '');
          return side === 'left' ? parts.left : parts.right;
        }
        return escapeHtml(row[side] || '');
      }

      function characterDiff(left, right) {
        if (!window.Diff || !window.Diff.diffChars) {
          return { left: '<span class="mark-changed">' + escapeHtml(left || ' ') + '</span>', right: '<span class="mark-changed">' + escapeHtml(right || ' ') + '</span>' };
        }
        const parts = window.Diff.diffChars(left, right);
        let l = '';
        let r = '';
        parts.forEach(function (part) {
          if (part.added) r += '<span class="mark-changed">' + escapeHtml(part.value || ' ') + '</span>';
          else if (part.removed) l += '<span class="mark-changed">' + escapeHtml(part.value || ' ') + '</span>';
          else {
            l += escapeHtml(part.value);
            r += escapeHtml(part.value);
          }
        });
        return { left: l || '&nbsp;', right: r || '&nbsp;' };
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
      }

      function updateDiffControls() {
        const hasDiffs = diffIndexes.length > 0;
        els.prevBtn.disabled = !hasDiffs;
        els.nextBtn.disabled = !hasDiffs;
        if (hasDiffs) {
          els.prevBtn.textContent = 'Previous Diff (' + (currentDiff + 1) + '/' + diffIndexes.length + ')';
          els.nextBtn.textContent = 'Next Diff (' + (currentDiff + 1) + '/' + diffIndexes.length + ')';
        } else {
          els.prevBtn.textContent = 'Previous Diff';
          els.nextBtn.textContent = 'Next Diff';
        }
      }

      function previousDiff() {
        if (!diffIndexes.length) return;
        currentDiff = currentDiff <= 0 ? diffIndexes.length - 1 : currentDiff - 1;
        scrollToDiff(currentDiff);
      }

      function nextDiff() {
        if (!diffIndexes.length) return;
        currentDiff = currentDiff >= diffIndexes.length - 1 ? 0 : currentDiff + 1;
        scrollToDiff(currentDiff);
      }

      function scrollToDiff(position) {
        const rowIndex = diffIndexes[position];
        document.querySelectorAll('.diff-row.current').forEach(function (node) { node.classList.remove('current'); });
        document.querySelectorAll('.diff-row[data-row="' + rowIndex + '"]').forEach(function (node) { node.classList.add('current'); });
        const leftRow = els.leftDiff.querySelector('.diff-row[data-row="' + rowIndex + '"]');
        if (leftRow) {
          const target = Math.max(0, leftRow.offsetTop - els.leftDiff.clientHeight / 3);
          els.leftDiff.scrollTop = target;
          els.rightDiff.scrollTop = target;
        }
        updateDiffControls();
      }

      function syncScroll(source, target) {
        if (syncingScroll) return;
        syncingScroll = true;
        target.scrollTop = source.scrollTop;
        target.scrollLeft = source.scrollLeft;
        syncingScroll = false;
      }
    })();
  </script>
</body>
</html>
